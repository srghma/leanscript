name = "LeanScript"
version = "0.1.0"
testDriver = "tests"
defaultTargets = ["HashableFloat", "LeanScript", "NonEmpty", "TyTests", "TermTests", "tests"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.34.0"

[[require]]
name = "aesop"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "HashableFloat"
globs = ["HashableFloat.+"]

[[lean_lib]]
name = "LeanScript"
globs = ["LeanScript.+"]

[[lean_lib]]
name = "NonEmpty"
globs = ["NonEmpty.+"]

[[lean_lib]]
name = "Spec"
globs = ["Spec.+"]

[[lean_lib]]
name = "TyTests"
srcDir = "Tests"
globs = ["TyTests.+"]

[[lean_lib]]
name = "TermTests"
srcDir = "Tests"
globs = ["TermTests.+"]

# The expensive runs moved out of `TyTests`/`TermTests` (compiled, not elaborated):
# `lake exe tests` (or `lake test`).
[[lean_exe]]
name = "tests"
srcDir = "Tests"
root = "Main"


name = "LeanScript"
version = "0.1.0"
testDriver = "tests"
defaultTargets = [
  "HashableFloat",
  "LeanScript",
  "NonEmpty",
  "TyTests",
  "TermTests",
  "tests",
  "LanguageJavascriptMini",
  "JsTerm",
  "JsSpec",
]

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.34.0"

[[require]]
name = "aesop"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "HashableFloat"
globs = ["HashableFloat.+"]

[[lean_lib]]
name = "LeanScript"
globs = ["LeanScript.+"]

[[lean_lib]]
name = "NonEmpty"
globs = ["NonEmpty.+"]

[[lean_lib]]
name = "Spec"
globs = ["Spec.+"]

[[lean_lib]]
name = "TyTests"
srcDir = "Tests"
globs = ["TyTests.+"]

[[lean_lib]]
name = "TermTests"
srcDir = "Tests"
globs = ["TermTests.+"]

# The expensive runs moved out of `TyTests`/`TermTests` (compiled, not elaborated):
# `lake exe tests` (or `lake test`).
[[lean_exe]]
name = "tests"
srcDir = "Tests"
root = "Main"

[[lean_lib]]
name = "LanguageJavascriptCommon"
globs = ["LanguageJavascriptCommon.+"]

[[lean_lib]]
name = "LanguageJavascriptMini"
globs = ["LanguageJavascriptMini.+"]

[[lean_lib]]
name = "LeanScriptCli"
globs = ["LeanScriptCli.+"]

# `leanscript FILE.lean`: translate the public functions of a Lean file to JavaScript.
[[lean_exe]]
name = "leanscript"
root = "LeanScriptCli.Main"
supportInterpreter = true

[[lean_lib]]
name = "JsTerm"
globs = ["JsTerm.+"]

# A model of the integer functions of `runtime.js`, with proofs that they compute Lean's
# operations and agree with the old runtime.
[[lean_lib]]
name = "RuntimeSpec"
globs = ["RuntimeSpec.+"]

# Proofs that the de-duplication refactorings (`NumberForm`, …) did not change behaviour.
[[lean_lib]]
name = "RefactorSpec"
globs = ["RefactorSpec.+"]

# Proofs about the generated lookup of the operations (`JsTerm/Ops/`): no extern has two
# candidates at one signature.
[[lean_lib]]
name = "OpsSpec"
globs = ["OpsSpec.+"]

# Proofs, in a model of JavaScript (state and exceptions), of the rewrites of the JavaScript
# backend that `Term` cannot express: `&&`/`||`, merged tests, digits in a concatenation,
# tails shared behind a labelled block, the arms of a case analysis grouped.
[[lean_lib]]
name = "JsSpec"
globs = ["JsSpec.+"]

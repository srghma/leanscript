name = "LeanScript"
version = "0.1.0"
defaultTargets = ["LeanScript", "NonEmpty", "SnapshotsMy", "SnapshotsPBOPure"]

[[require]]
name = "aesop"
scope = "leanprover-community"
rev = "v4.34.0"

[[lean_lib]]
name = "LeanScript"
globs = ["LeanScript.+"]

[[lean_lib]]
name = "NonEmpty"
globs = ["NonEmpty.+"]

[[lean_lib]]
name = "SnapshotsMy"
globs = ["SnapshotsMy.+"]

[[lean_lib]]
name = "SnapshotsPBOPure"
globs = ["SnapshotsPBOPure.+"]
